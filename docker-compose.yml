version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: stockali-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockali
      POSTGRES_PASSWORD: stockali_dev_password
      POSTGRES_DB: stockali
    ports:
      - "5432:5432"
    volumes:
      - stockali_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stockali-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: stockali-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  stockali_db_data:
